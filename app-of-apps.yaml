apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
spec:
  destination:
    name: 'in-cluster'
    namespace: argocd
  source:
    path: applications
    repoURL: 'git@github.com:MaxBurgersSkyworkz/poc-Wehkamp-ArgoCD-Deployments.git'
    targetRevision: HEAD
    directory:
      recurse: true
      jsonnet: {}
      resource:
        kind:
          - Application.argoproj.io
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2
